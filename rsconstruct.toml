# rsconstruct build configuration for this repository.

[build]
# src_dirs entries name directories; "." (the whole tree) is a config error
reject_dot_src_dirs = true

[analyzer.markdown]

[processor.checker.rumdl]
src_dirs = ["exercises", "examples"]
src_files = ["README.md"]

[processor.checker.zspell]
src_dirs = ["exercises"]

[processor.checker.ishellcheck]
src_dirs = ["scripts", "exercises"]

# ─── toml / yaml / json ──────────────────────────────────────────────────────

[processor.checker.taplo]
src_files = [".rumdl.toml", "rsconstruct.toml"]

# lint the Lua configuration with luacheck (policy: .luacheckrc)
[processor.checker.iluacheck]
src_dirs = ["config"]

# lint the YAML files with yamllint (policy: .yamllint.yaml)
[processor.checker.iyamllint]
src_dirs = [".github"]
src_files = [".yamllint.yaml"]

# lint the GitHub Actions workflow files with actionlint
[processor.checker.iactionlint]
src_dirs = [".github/workflows"]

# audit the GitHub Actions workflow files for security problems with zizmor
# (policy: .github/zizmor.yml)
[processor.checker.zizmor]
src_dirs = [".github/workflows"]
# The pedantic persona: also the findings zizmor's default persona keeps
# quiet (undocumented permissions, template expansion of any context,
# unnamed jobs, ...). --offline and --no-progress are the default args.
args = ["--offline", "--no-progress", "--persona=pedantic"]

# ─── c / c++ ─────────────────────────────────────────────────────────────────

# Demos whose whole program lives in one directory: one run per directory.
[processor.checker.cppcheck.single_dir]
dep_inputs = ["cppcheck.cfg"]
batch_by_dir = true
src_dirs = ["examples"]
src_exclude_dirs = ["bin_and_lib", "large_project", "wrong_order"]
args = [
	"--error-exitcode=1",
	"--enable=warning,style,performance,portability,information,unusedFunction",
	"--check-level=exhaustive",
	"--inline-suppr",
	"--library=cppcheck.cfg",
]

# bin_and_lib is one program split over mybin/ and mylib/ (add_subdirectory in its CMakeLists.txt): one run over the whole project.
[processor.checker.cppcheck.bin_and_lib]
batch = true
src_dirs = ["examples/bin_and_lib"]
args = [
	"--error-exitcode=1",
	"--enable=warning,style,performance,portability,information,unusedFunction",
	"--check-level=exhaustive",
	"--inline-suppr",
]

# large_project is one program split over mybin/ and mylib/ (add_subdirectory in its CMakeLists.txt): one run over the whole project.
[processor.checker.cppcheck.large_project]
batch = true
src_dirs = ["examples/large_project"]
args = [
	"--error-exitcode=1",
	"--enable=warning,style,performance,portability,information,unusedFunction",
	"--check-level=exhaustive",
	"--inline-suppr",
]

# wrong_order is one program split over mybin/ and mylib/ (add_subdirectory in its CMakeLists.txt): one run over the whole project.
[processor.checker.cppcheck.wrong_order]
batch = true
src_dirs = ["examples/wrong_order"]
args = [
	"--error-exitcode=1",
	"--enable=warning,style,performance,portability,information,unusedFunction",
	"--check-level=exhaustive",
	"--inline-suppr",
]
