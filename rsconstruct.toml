# rsconstruct build configuration for this repository.

[analyzer.markdown]

[processor.rumdl]
src_dirs = ["exercises", "examples"]
src_files = ["README.md"]

[processor.zspell]
src_dirs = ["exercises"]

[processor.shellcheck]
src_dirs = ["scripts", "exercises"]

# ─── toml / yaml / json ──────────────────────────────────────────────────────

[processor.taplo]
src_dirs = ["."]

# lint the GitHub Actions workflow files with actionlint
[processor.actionlint]
src_dirs = [".github/workflows"]

# ─── c / c++ ─────────────────────────────────────────────────────────────────

[processor.cppcheck]
src_dirs = ["examples"]
args = [
	"--error-exitcode=1",
	"--enable=warning,style,performance,portability",
	"--inline-suppr",
]
